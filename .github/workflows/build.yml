name: Build Resource Pack

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create ZIP archive
        run: zip -r ShimesabaRPGResourcePack.zip assets pack.mcmeta pack.png

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: ShimesabaRPGResourcePack.zip
